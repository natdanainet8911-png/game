<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest of the Scholar - ปราชญ์น้อยกู้หมู่บ้าน</title>
    <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2b2b2b;
            color: #f1f1f1;
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background-color: #1a1a1a;
            border: 4px solid #4a3b32;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #top-bar {
            height: 40px;
            background-color: #2c211a;
            border-bottom: 2px solid #4a3b32;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 600;
            color: #e2c08d;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        #scene {
            flex: 1;
            background-color: #5c94fc;
            position: relative;
            background-size: cover;
            background-position: center;
            transition: background 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Scene Backgrounds using CSS gradients/colors */
        .bg-title { background: linear-gradient(135deg, #1b263b, #415a77); }
        .bg-village { background: linear-gradient(to bottom, #87CEEB 50%, #7CFC00 50%); }
        .bg-shop { background: linear-gradient(to bottom, #8B4513 40%, #A0522D 40%, #cd853f 100%); }
        .bg-farm { background: linear-gradient(to bottom, #87CEEB 40%, #556B2F 40%, #6B8E23 100%); }

        #title-text {
            text-align: center;
            color: #ffd700;
            font-family: 'Chonburi', serif;
            font-size: 48px;
            text-shadow: 3px 3px 0 #8b4513, -1px -1px 0 #8b4513, 1px -1px 0 #8b4513, -1px 1px 0 #8b4513, 1px 1px 0 #8b4513;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #sprites {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .sprite {
            font-size: 120px;
            filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.5));
            transition: opacity 0.3s;
        }
        #player-sprite { opacity: 0; }
        #npc-sprite { opacity: 0; transform: scaleX(-1); }

        #dialog-box {
            height: 200px;
            background-color: #1c1c1c;
            border-top: 4px solid #e2c08d;
            padding: 20px 30px;
            box-sizing: border-box;
            position: relative;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        #speaker-name {
            background-color: #e2c08d;
            color: #1c1c1c;
            display: inline-block;
            padding: 5px 15px;
            font-weight: 600;
            border-radius: 4px;
            position: absolute;
            top: -18px;
            left: 20px;
            font-size: 18px;
            border: 2px solid #4a3b32;
        }
        #dialog-text {
            margin-top: 15px;
            font-size: 20px;
            line-height: 1.5;
            color: #f1f1f1;
        }
        #choices {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            background-color: #3e2723;
            color: #e2c08d;
            border: 2px solid #e2c08d;
            padding: 10px 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #2c1a16;
        }
        button:hover {
            background-color: #5d4037;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2c1a16;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2c1a16;
        }
        input[type="number"] {
            background-color: #2b2b2b;
            color: #e2c08d;
            border: 2px solid #e2c08d;
            padding: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 18px;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #ffd700;
        }
        .highlight {
            color: #ffd700;
            font-weight: bold;
        }
        .math-text {
            color: #87cefa;
            font-style: italic;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <span>📍 <span id="location-text">หน้าจอหลัก</span></span>
        <span>⭐ เลเวล: <span id="lvl-val">1</span> | 💎 EXP: <span id="exp-val">0</span>/100</span>
    </div>
    
    <div id="scene" class="bg-title">
        <div id="sprites">
            <div id="player-sprite" class="sprite">🧑‍🎓</div>
            <div id="npc-sprite" class="sprite"></div>
        </div>
        <div id="title-text">
            Quest of the Scholar<br>
            <span style="font-size: 28px; color: #fff; text-shadow: 2px 2px 0 #000;">ปราชญ์น้อยกู้หมู่บ้าน</span>
        </div>
    </div>
    
    <div id="dialog-box">
        <div id="speaker-name">ระบบ</div>
        <div id="dialog-text">ยินดีต้อนรับสู่โลกแฟนตาซี! ที่นี่ความรู้คือพลังเวทมนตร์ของคุณ</div>
        <div id="choices">
            <button onclick="startGame()">▶ เริ่มการผจญภัย</button>
        </div>
    </div>
</div>

<script>
    // --- Game State ---
    let exp = 0;
    let level = 1;

    // --- UI Elements ---
    const ui = {
        scene: document.getElementById('scene'),
        title: document.getElementById('title-text'),
        speaker: document.getElementById('speaker-name'),
        text: document.getElementById('dialog-text'),
        choices: document.getElementById('choices'),
        player: document.getElementById('player-sprite'),
        npc: document.getElementById('npc-sprite'),
        exp: document.getElementById('exp-val'),
        lvl: document.getElementById('lvl-val'),
        loc: document.getElementById('location-text')
    };

    // --- Core Functions ---
    function updateStats(gainedExp) {
        exp += gainedExp;
        if(exp >= 100) {
            level++;
            exp -= 100;
            alert(`🎉 ยินดีด้วย! เลเวลอัปเป็นระดับ ${level}`);
        }
        ui.exp.innerText = exp;
        ui.lvl.innerText = level;
    }

    function setScene(locName, bgClass, showPlayer, npcEmoji) {
        ui.loc.innerText = locName;
        ui.scene.className = bgClass;
        ui.title.style.display = 'none';
        ui.player.style.opacity = showPlayer ? 1 : 0;
        if (npcEmoji) {
            ui.npc.innerText = npcEmoji;
            ui.npc.style.opacity = 1;
        } else {
            ui.npc.style.opacity = 0;
        }
    }

    function setDialog(speaker, text, buttonsHtml) {
        ui.speaker.innerText = speaker;
        // Simple typewriter effect simulation (optional, kept instant for simplicity)
        ui.text.innerHTML = text; 
        ui.choices.innerHTML = buttonsHtml;
    }

    function startGame() {
        villageHub();
    }

    // --- HUB: Village Square ---
    function villageHub() {
        setScene('จัตุรัสหมู่บ้านโอ๊ควูด', 'bg-village', true, null);
        setDialog('ลีโอ (คุณ)', 'ถึงแล้ว... หมู่บ้านโอ๊ควูด ดูเหมือนชาวบ้านกำลังวุ่นวายกับปัญหาในชีวิตประจำวันนะ ฉันควรใช้ความรู้ไปช่วยใครก่อนดี?',
            `<button onclick="merchantQuest()">💰 ไปหาพ่อค้า (วิทย์ ม.1)</button>
             <button onclick="farmerQuest()">🌾 ไปหาลุงชาวนา (คณิต ม.1)</button>`
        );
    }

    // ==========================================
    // QUEST 1: พ่อค้ามั่งคั่ง (วิทยาศาสตร์ - ความหนาแน่น)
    // ==========================================
    function merchantQuest() {
        setScene('ร้านค้าของเศรษฐี', 'bg-shop', true, '🫅');
        setDialog('พ่อค้ามั่งคั่ง', 'โอ้! ท่านบัณฑิต ข้ากำลังปวดหัวเลย ข้าเพิ่งซื้อ <span class="highlight">มงกุฎทองคำ</span> มาในราคาแพงหูฉี่ แต่ข้ารู้สึกว่ามันเบาแปลกๆ ท่านช่วยใช้ "วิทยาศาสตร์" ตรวจสอบให้ข้าที!',
            `<button onclick="merchantStep1()">🔍 ตรวจสอบมงกุฎ</button>
             <button onclick="villageHub()">↩ กลับหมู่บ้าน</button>`
        );
    }

    function merchantStep1() {
        setDialog('ลีโอ', 'สบายมากครับ เราสามารถใช้หลักการของ <b>อาร์คิมิดีส</b> ในการหาความหนาแน่นได้ <br><span class="math-text">สูตร: ความหนาแน่น (D) = มวล (M) ÷ ปริมาตร (V)</span><br>ก่อนอื่นเราต้องชั่งน้ำหนักมงกุฎก่อน!',
            `<button onclick="merchantStep2()">⚖️ ชั่งน้ำหนัก</button>`
        );
    }

    function merchantStep2() {
        setDialog('ระบบ', 'คุณนำมงกุฎไปชั่งบนตาชั่งดิจิทัลของพ่อค้า... <br>⚖️ <b>มวลที่ได้คือ: <span class="highlight">450 กรัม</span></b>',
            `<button onclick="merchantStep3()">💧 หาปริมาตรต่อ</button>`
        );
    }

    function merchantStep3() {
        setDialog('ลีโอ', 'ต่อไป เราจะนำมงกุฎไปหย่อนลงในถังน้ำ (ถ้วยยูเรก้า) น้ำที่ล้นออกมาจะเท่ากับปริมาตรของมงกุฎพอดี!',
            `<button onclick="merchantStep4()">🌊 หย่อนมงกุฎลงน้ำ</button>`
        );
    }

    function merchantStep4() {
        setDialog('ระบบ', 'คุณหย่อนมงกุฎลงไป น้ำล้นออกมาใส่กระบอกตวง... <br>🧪 <b>ปริมาตรที่วัดได้คือ: <span class="highlight">50 ลูกบาศก์เซนติเมตร (cm³)</span></b>',
            `<button onclick="merchantStep5()">🧮 คำนวณเลย</button>`
        );
    }

    function merchantStep5() {
        setDialog('ลีโอ', 'ได้เวลาใช้คณิตศาสตร์แล้ว! <br><span class="math-text">มวล = 450 g, ปริมาตร = 50 cm³</span><br>ความหนาแน่นคือเท่าไหร่? (เอา 450 หารด้วย 50)',
            `<input type="number" id="ans-density" placeholder="ใส่คำตอบ (ตัวเลข)">
             <button onclick="checkDensity()">✅ ตอบ</button>`
        );
    }

    function checkDensity() {
        let ans = document.getElementById('ans-density').value;
        if (ans == 9) {
            setDialog('ลีโอ', 'ถูกต้อง! ความหนาแน่นคือ <span class="highlight">9 g/cm³</span> <br>แต่ทองคำแท้ต้องมีความหนาแน่นประมาณ <b>19.3 g/cm³</b>... พ่อค้าครับ มงกุฎนี้ปลอมแน่นอน!',
                `<button onclick="merchantWin()">แจ้งพ่อค้า</button>`
            );
        } else {
            setDialog('ลีโอ', 'เอ๊ะ... คำนวณผิดหรือเปล่านะ ลองหารดูใหม่ <span class="math-text">450 ÷ 50</span> ได้เท่าไหร่นะ? ตัดศูนย์ออกแล้วท่องสูตรคูณแม่ 5 ดูสิ',
                `<button onclick="merchantStep5()">🔄 ลองใหม่</button>`
            );
        }
    }

    function merchantWin() {
        updateStats(50);
        setDialog('พ่อค้ามั่งคั่ง', 'ของปลอมงั้นรึ! ขอบคุณท่านมากที่ช่วยข้าไว้ ข้าเกือบจะเสียรู้พวกโจรแล้วสิ รับรางวัลนี้ไปเลย!',
            `<button onclick="villageHub()">↩ กลับหมู่บ้าน</button>`
        );
    }

    // ==========================================
    // QUEST 2: ลุงชาวนา (คณิตศาสตร์ - ความยาวรอบรูป)
    // ==========================================
    function farmerQuest() {
        setScene('ทุ่งนาโอ๊ควูด', 'bg-farm', true, '🧑‍🌾');
        setDialog('ลุงชาวนา', 'พ่อหนุ่ม! ลุงกำลังจะล้อมรั้วแปลงผักกะหล่ำปลีใหม่ แต่ลุงคำนวณไม่ถูกว่าต้องซื้อรั้วไม้มาให้ยาวเท่าไหร่ เอ็งช่วยลุงทีได้ไหม?',
            `<button onclick="farmerStep1()">📐 ช่วยลุงคำนวณ</button>
             <button onclick="villageHub()">↩ กลับหมู่บ้าน</button>`
        );
    }

    function farmerStep1() {
        setDialog('ลีโอ', 'ได้เลยครับลุง แปลงผักของลุงเป็นรูปเรขาคณิตแบบไหน และมีความกว้างความยาวเท่าไหร่ครับ?',
            `<button onclick="farmerStep2()">ฟังลุงชาวนา</button>`
        );
    }

    function farmerStep2() {
        setDialog('ลุงชาวนา', 'แปลงผักลุงเป็นรูป <span class="highlight">สี่เหลี่ยมผืนผ้า</span> น่ะ มี <b>ความกว้าง 6 เมตร</b> และ <b>ความยาว 8 เมตร</b> ลุงต้องซื้อรั้วกี่เมตรถึงจะล้อมครบ 4 ด้านพอดีล่ะ?',
            `<button onclick="farmerStep3()">🧮 คำนวณความยาวรอบรูป</button>`
        );
    }

    function farmerStep3() {
        setDialog('ลีโอ', 'การหาความยาวรั้ว คือการหา "ความยาวรอบรูป" <br><span class="math-text">สูตร: (กว้าง + ยาว) × 2</span><br>กว้าง = 6, ยาว = 8 ดังนั้นต้องใช้รั้วยาวเท่าไหร่?',
            `<input type="number" id="ans-perimeter" placeholder="ใส่คำตอบ (ตัวเลข)">
             <button onclick="checkPerimeter()">✅ ตอบ</button>`
        );
    }

    function checkPerimeter() {
        let ans = document.getElementById('ans-perimeter').value;
        if (ans == 28) {
            setDialog('ลีโอ', 'ถูกต้องครับลุง! (6 + 8) = 14 แล้วคูณ 2 จะได้ <span class="highlight">28 เมตร</span> ครับ ลุงซื้อไม้มายาว 28 เมตรได้เลย!',
                `<button onclick="farmerWin()">แจ้งลุงชาวนา</button>`
            );
        } else {
            setDialog('ลีโอ', 'เดี๋ยวนะ... ตัวเลขดูแปลกๆ ลองเอา <span class="math-text">6 บวก 8</span> ก่อน แล้วค่อยเอาผลลัพธ์ไป <span class="math-text">คูณ 2</span> ดูอีกทีนะ',
                `<button onclick="farmerStep3()">🔄 ลองใหม่</button>`
            );
        }
    }

    function farmerWin() {
        updateStats(50);
        setDialog('ลุงชาวนา', 'โอ้โห! เก่งจริงๆ พ่อหนุ่ม นี่ถ้าไม่ได้เอ็ง ลุงคงซื้อรั้วมาขาดแน่ๆ เอานี่ไปเป็นค่าตอบแทนนะ!',
            `<button onclick="villageHub()">↩ กลับหมู่บ้าน</button>`
        );
    }
</script>
</body>
</html>
